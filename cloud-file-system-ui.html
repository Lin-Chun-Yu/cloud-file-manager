<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>雲端檔案管理系統 — Composite / Visitor / Observer / Command Demo</title>
<style>
  :root {
    --bg-page: #eef1f5;
    --panel-bg: #ffffff;
    --border: #e3e6ea;
    --text-main: #1f2430;
    --text-muted: #8a92a3;
    --text-faint: #b3b9c4;

    --blue: #2f6fed;
    --blue-light: #eaf1ff;
    --blue-dark: #1e293b;

    --folder: #f0b429;
    --docx: #3b82f6;
    --png: #8b5cf6;
    --txt: #64748b;

    --red: #ef4444;
    --red-light: #fef2f2;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --purple: #8b5cf6;
    --purple-light: #f3f0ff;
    --orange: #d97706;
    --orange-light: #fff8e8;

    --console-bg: #0d1526;
    --console-border: #1c2740;
    --console-text: #cbd5e1;

    --radius: 10px;
    --radius-lg: 14px;
    --shadow: 0 1px 2px rgba(20, 24, 33, 0.04), 0 4px 14px rgba(20, 24, 33, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    font-size: 14px;
    padding: 20px;
  }

  .app {
    max-width: 1360px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.55fr 1.05fr 1fr;
    grid-template-rows: auto auto 1fr;
    gap: 14px;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 13.5px;
    border-bottom: 1px solid var(--border);
  }

  .panel-header .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .panel-header .badge-live {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--blue);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .panel-header .badge-live .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  /* ---------------- Toolbar ---------------- */
  .toolbar {
    grid-column: 1 / 4;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    flex-wrap: wrap;
  }
  .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 4px 4px; }
  .tbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .tbtn:hover:not(:disabled) { background: #f2f4f7; }
  .tbtn:disabled { color: var(--text-faint); cursor: not-allowed; }
  .tbtn .icon { width: 15px; height: 15px; }
  .tbtn.icon-only { padding: 7px 8px; }
  .tbtn.active { background: var(--blue-dark); color: #fff; }
  .tbtn.active:hover { background: var(--blue-dark); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .chip .plus { font-weight: 700; }
  .chip[data-tag="Urgent"] { color: var(--red); border-color: #fbd5d5; }
  .chip[data-tag="Work"] { color: var(--blue); border-color: #cfe0ff; }
  .chip[data-tag="Personal"] { color: var(--green); border-color: #c9f0d6; }
  .chip.active[data-tag="Urgent"] { background: var(--red); color: #fff; border-color: var(--red); }
  .chip.active[data-tag="Work"] { background: var(--blue); color: #fff; border-color: var(--blue); }
  .chip.active[data-tag="Personal"] { background: var(--green); color: #fff; border-color: var(--green); }
  .chip .count {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    min-width: 15px;
    height: 15px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }
  .toolbar-spacer { flex: 1; }

  /* ---------------- Tree panel ---------------- */
  .panel-tree { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; min-height: 560px; }
  .tree-scroll { padding: 14px 12px; overflow: auto; flex: 1; }

  .node-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid transparent;
    margin-bottom: 1px;
  }
  .node-row:hover { background: #f7f8fa; }
  .node-row.selected { background: var(--blue-light); }
  .node-row.selected .node-name { color: var(--blue); font-weight: 700; }
  .node-row.matched { border-color: var(--red); background: var(--red-light); }
  .node-row .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .node-row .node-name { font-size: 13px; }
  .node-row .node-detail { font-size: 11.5px; color: var(--text-muted); }
  .node-row .node-size { font-size: 11px; color: var(--text-faint); margin-left: 2px; }
  .node-row .grow { flex: 1; }
  .node-tags { display: flex; gap: 4px; }
  .tag-pill {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.2px;
    color: #fff;
    padding: 2px 6px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag-pill.Urgent { background: var(--red); }
  .tag-pill.Work { background: var(--blue); }
  .tag-pill.Personal { background: var(--green); }
  .tag-pill .x { cursor: pointer; opacity: 0.8; }
  .tag-pill .x:hover { opacity: 1; }
  .children { margin-left: 22px; border-left: 1px dashed var(--border); padding-left: 8px; }

  /* ---------------- Visitor panel ---------------- */
  .panel-visitor { grid-column: 2; grid-row: 2; }
  .visitor-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .action-btn .icon { width: 16px; height: 16px; }
  .action-btn.purple { background: var(--purple-light); color: var(--purple); }
  .action-btn.purple:hover { filter: brightness(0.97); }
  .action-btn.orange { background: var(--orange-light); color: var(--orange); }
  .action-btn.orange:hover { filter: brightness(0.97); }

  .search-row { display: flex; gap: 6px; margin-top: 4px; }
  .search-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 8px;
  }
  .search-input-wrap input {
    border: none; outline: none; padding: 9px 4px; font-size: 13px; flex: 1; color: var(--text-main); min-width: 0;
  }
  .search-input-wrap .clear-x { cursor: pointer; color: var(--text-faint); font-size: 15px; padding: 0 2px; }
  .search-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--green); color: #fff; border: none;
    padding: 0 14px; border-radius: 9px; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .search-btn:hover { filter: brightness(0.95); }
  .search-btn .icon { width: 14px; height: 14px; }

  /* ---------------- Observer panel ---------------- */
  .panel-observer { grid-column: 2; grid-row: 3; }
  .observer-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .obs-row-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 3px; }
  .obs-node { font-size: 14px; font-weight: 700; color: var(--blue); }
  .obs-progress-head { display: flex; justify-content: space-between; align-items: baseline; }
  .obs-progress-pct { font-size: 13px; font-weight: 800; color: var(--text-main); }
  .progress-track { height: 7px; background: #eef0f3; border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); width: 0%; border-radius: 999px; transition: width 0.15s linear; }
  .obs-nodes-count { text-align: right; font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* ---------------- Console panel ---------------- */
  .panel-console {
    grid-column: 3; grid-row: 2 / 4;
    background: var(--console-bg);
    border: 1px solid var(--console-border);
    display: flex; flex-direction: column;
    min-height: 560px;
  }
  .panel-console .panel-header { border-bottom: 1px solid var(--console-border); color: #fff; }
  .panel-console .panel-header .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .console-log {
    flex: 1; overflow: auto; padding: 10px 12px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.7;
  }
  .console-log .line { color: var(--console-text); white-space: pre-wrap; word-break: break-all; }
  .console-log .line.match { color: #4ade80; font-weight: 700; }
  .console-log .line.cmd { color: #60a5fa; }
  .console-log .line.undo { color: #f59e0b; }
  .console-log .line.result { color: #f8fafc; font-weight: 700; }
  .console-result-box {
    margin: 10px 12px 12px;
    background: #16233f;
    border: 1px solid #24365c;
    border-radius: 9px;
    padding: 12px 14px;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    text-align: center;
  }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto; }
    .panel-tree, .panel-visitor, .panel-observer, .panel-console { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Toolbar -->
  <div class="panel toolbar">
    <button class="tbtn icon-only" id="btnUndo" title="復原 (Undo)"></button>
    <button class="tbtn icon-only" id="btnRedo" title="重做 (Redo)"></button>
    <div class="sep"></div>
    <button class="tbtn" id="btnCopy"></button>
    <button class="tbtn" id="btnPaste"></button>
    <button class="tbtn" id="btnDelete"></button>
    <div class="sep"></div>
    <button class="tbtn" id="sortName">名稱</button>
    <button class="tbtn" id="sortSize">大小</button>
    <button class="tbtn" id="sortType">類型</button>
    <button class="tbtn" id="sortTag">標籤</button>
    <div class="sep"></div>
    <span class="chip" data-tag="Urgent" id="chipUrgent"><span class="plus">+</span> Urgent<span class="count" id="countUrgent" style="display:none">0</span></span>
    <span class="chip" data-tag="Work" id="chipWork"><span class="plus">+</span> Work<span class="count" id="countWork" style="display:none">0</span></span>
    <span class="chip" data-tag="Personal" id="chipPersonal"><span class="plus">+</span> Personal<span class="count" id="countPersonal" style="display:none">0</span></span>
  </div>

  <!-- Tree -->
  <div class="panel panel-tree">
    <div class="panel-header">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f0b429" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      檔案階層 (Composite)
    </div>
    <div class="tree-scroll" id="treeRoot"></div>
  </div>

  <!-- Visitor -->
  <div class="panel panel-visitor">
    <div class="panel-header">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      訪問者操作 (Visitor)
    </div>
    <div class="visitor-body">
      <button class="action-btn purple" id="btnCalcSize">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/></svg>
        計算大小
      </button>
      <button class="action-btn orange" id="btnExportXml">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        XML 匯出
      </button>
      <div class="search-row">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder=".docx" value=".docx" />
          <span class="clear-x" id="clearSearch">×</span>
        </div>
        <button class="search-btn" id="btnSearch">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          搜尋
        </button>
      </div>
    </div>
  </div>

  <!-- Observer -->
  <div class="panel panel-observer">
    <div class="panel-header">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2"><path d="M3 12h4l2 8 4-16 2 8h6"/></svg>
      監控 (Observer)
      <span class="badge-live" id="liveBadge"><span class="dot"></span>LIVE</span>
    </div>
    <div class="observer-body">
      <div>
        <div class="obs-row-label">目前節點</div>
        <div class="obs-node" id="obsNode">—</div>
      </div>
      <div>
        <div class="obs-progress-head">
          <div class="obs-row-label" style="margin-bottom:0">掃描進度</div>
          <div class="obs-progress-pct" id="obsPct">0%</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="obsFill"></div></div>
        <div class="obs-nodes-count" id="obsCount">0 / 0 Nodes</div>
      </div>
    </div>
  </div>

  <!-- Console -->
  <div class="panel panel-console">
    <div class="panel-header"><span class="dot-live"></span>CONSOLE</div>
    <div class="console-log" id="consoleLog"></div>
    <div class="console-result-box" id="resultBox" style="display:none"></div>
  </div>

</div>

<script>
/* =========================================================
 * 雲端檔案管理系統 — Web UI
 * Composite Pattern (檔案階層) + Visitor (計算大小/搜尋/XML)
 * + Observer (即時監控) + Command Pattern (Undo/Redo)
 * =========================================================
 */

/* ---------- 圖示 ---------- */
const ICONS = {
  folder: '<svg class="icon" viewBox="0 0 24 24" fill="#f0b429" stroke="#d99a1b" stroke-width="1"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
  docx: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  png: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  txt: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>',
  undo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  redo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>',
  copy: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  paste: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>',
  trash: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
};
document.getElementById('btnUndo').innerHTML = ICONS.undo;
document.getElementById('btnRedo').innerHTML = ICONS.redo;
document.getElementById('btnCopy').innerHTML = ICONS.copy + ' 複製';
document.getElementById('btnPaste').innerHTML = ICONS.paste + ' 貼上';
document.getElementById('btnDelete').innerHTML = ICONS.trash + ' 刪除';

/* ---------- Composite Pattern：Domain Model ---------- */
let __id = 0;
function nextId() { return 'n' + (++__id); }

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) {
    const kb = bytes / 1024;
    return (Number.isInteger(kb) ? kb : kb.toFixed(1)) + 'KB';
  }
  const mb = bytes / (1024 * 1024);
  return (Number.isInteger(mb) ? mb : mb.toFixed(1)) + 'MB';
}

class FileSystemComponent {
  constructor(name) {
    this.id = nextId();
    this.name = name;
    this.tags = [];
    this.parent = null;
  }
  addTag(tag) { if (!this.tags.includes(tag)) this.tags.push(tag); }
  removeTag(tag) { this.tags = this.tags.filter((t) => t !== tag); }
  getExtension() { return ''; }
  getSize() { throw new Error('not implemented'); }
  clone() { throw new Error('not implemented'); }
}

class BaseFile extends FileSystemComponent {
  constructor(name, sizeBytes) { super(name); this.sizeBytes = sizeBytes; }
  getSize() { return this.sizeBytes; }
  getIcon() { return ICONS.txt; }
  getDetail() { return ''; }
}

class WordFile extends BaseFile {
  constructor(name, sizeBytes, pages) { super(name, sizeBytes); this.pages = pages; }
  getExtension() { return 'docx'; }
  getIcon() { return ICONS.docx; }
  getDetail() { return `頁數: ${this.pages}, 大小: ${formatBytes(this.sizeBytes)}`; }
  clone() { const c = new WordFile(this.name, this.sizeBytes, this.pages); c.tags = [...this.tags]; return c; }
}

class ImageFile extends BaseFile {
  constructor(name, sizeBytes, w, h) { super(name, sizeBytes); this.w = w; this.h = h; }
  getExtension() { const p = this.name.split('.'); return p.length > 1 ? p[p.length - 1] : ''; }
  getIcon() { return ICONS.png; }
  getDetail() { return `解析度: ${this.w}x${this.h}, 大小: ${formatBytes(this.sizeBytes)}`; }
  clone() { const c = new ImageFile(this.name, this.sizeBytes, this.w, this.h); c.tags = [...this.tags]; return c; }
}

class TextFile extends BaseFile {
  constructor(name, sizeBytes, enc) { super(name, sizeBytes); this.enc = enc; }
  getExtension() { return 'txt'; }
  getIcon() { return ICONS.txt; }
  getDetail() { return `編碼: ${this.enc}, 大小: ${formatBytes(this.sizeBytes)}`; }
  clone() { const c = new TextFile(this.name, this.sizeBytes, this.enc); c.tags = [...this.tags]; return c; }
}

class Directory extends FileSystemComponent {
  constructor(name) { super(name); this.children = []; }
  add(child) { child.parent = this; this.children.push(child); }
  remove(child) { this.children = this.children.filter((c) => c !== child); }
  getSize() { return this.children.reduce((s, c) => s + c.getSize(), 0); }
  getIcon() { return ICONS.folder; }
  clone() {
    const c = new Directory(this.name + '_copy');
    c.tags = [...this.tags];
    this.children.forEach((ch) => c.add(ch.clone()));
    return c;
  }
  sortChildren(by, order) {
    const factor = order === 'asc' ? 1 : -1;
    this.children.sort((a, b) => {
      if (by === 'name') return a.name.localeCompare(b.name) * factor;
      if (by === 'size') return (a.getSize() - b.getSize()) * factor;
      if (by === 'type') return a.getExtension().localeCompare(b.getExtension()) * factor;
      if (by === 'tag') return ((a.tags[0] || '').localeCompare(b.tags[0] || '')) * factor;
      return 0;
    });
  }
}

/* ---------- Visitor：走訪工具（計算大小 / 搜尋 / XML） ---------- */
function toXmlTag(name) {
  let tag = name.replace(/\s*\(/g, '_').replace(/\)/g, '').replace(/\./g, '_').replace(/\s+/g, '_');
  // XML 標籤不可以數字開頭（例如 "2025備份"），自動補上底線前綴修正
  if (tag === '' || /^[0-9]/.test(tag)) tag = '_' + tag;
  return tag;
}
function toXML(node, indent = '') {
  if (node instanceof Directory) {
    const tag = toXmlTag(node.name);
    let xml = `${indent}<${tag}>\n`;
    node.children.forEach((c) => (xml += toXML(c, indent + '  ')));
    xml += `${indent}</${tag}>\n`;
    return xml;
  }
  const tag = toXmlTag(node.name);
  return `${indent}<${tag}>${node.getDetail()}</${tag}>\n`;
}
/** 攤平整棵樹（前序），供 Observer 走訪動畫、計算大小、搜尋共用 */
function flattenTree(node, path = []) {
  const full = [...path, node];
  let list = [full];
  if (node instanceof Directory) {
    node.children.forEach((c) => { list = list.concat(flattenTree(c, full)); });
  }
  return list;
}

/* ---------- Command Pattern：Undo / Redo ---------- */
class HistoryManager {
  constructor() { this.undoStack = []; this.redoStack = []; }
  execute(cmd) {
    cmd.execute();
    this.undoStack.push(cmd);
    this.redoStack = [];
    log(`執行 ${cmd.description}`, 'cmd');
    render();
  }
  undo() {
    const cmd = this.undoStack.pop();
    if (!cmd) { log('沒有可復原的操作', 'undo'); return; }
    cmd.undo();
    this.redoStack.push(cmd);
    log(`復原 ${cmd.description}`, 'undo');
    render();
  }
  redo() {
    const cmd = this.redoStack.pop();
    if (!cmd) { log('沒有可重做的操作', 'undo'); return; }
    cmd.execute();
    this.undoStack.push(cmd);
    log(`重做 ${cmd.description}`, 'cmd');
    render();
  }
}
class RemoveCommand {
  constructor(node) { this.node = node; this.parent = node.parent; this.description = `刪除項目: ${node.name}`; }
  execute() { this.parent.remove(this.node); }
  undo() { this.parent.add(this.node); }
}
class PasteCommand {
  constructor(target, source) { this.target = target; this.pasted = source.clone(); this.description = `貼上項目: ${this.pasted.name}`; }
  execute() { this.target.add(this.pasted); }
  undo() { this.target.remove(this.pasted); }
}
class ToggleTagCommand {
  constructor(node, tag) {
    this.node = node; this.tag = tag; this.hadTag = node.tags.includes(tag);
    this.description = `貼上標籤(${tag}): ${node.name}`;
  }
  execute() { this.hadTag ? this.node.removeTag(this.tag) : this.node.addTag(this.tag); }
  undo() { this.hadTag ? this.node.addTag(this.tag) : this.node.removeTag(this.tag); }
}
class SortCommand {
  constructor(root, by, order) {
    this.by = by; this.order = order;
    this.description = `執行 ${by} 排序策略`;
    this.snapshots = [];
    (function walk(n) {
      if (n instanceof Directory) { this.snapshots.push([n, [...n.children]]); n.children.forEach(walk, this); }
    }).call(this, root);
  }
  execute() { this.snapshots.forEach(([dir]) => dir.sortChildren(this.by, this.order)); }
  undo() { this.snapshots.forEach(([dir, children]) => { dir.children = children; }); }
}

/* ---------- 建立範例資料（依客戶範例結構圖 + 面板截圖擴充 API 介面定義.docx） ---------- */
const root = new Directory('我的根目錄');
const projectDocs = new Directory('專案文件');
const spec = new WordFile('需求規格書.docx', 500 * 1024, 35);
const apiDoc = new WordFile('API介面定義.docx', 120 * 1024, 12);
const arch = new ImageFile('系統架構圖.png', 2048 * 1024, 1920, 1080);
projectDocs.add(spec);
projectDocs.add(apiDoc);
projectDocs.add(arch);

const personalNotes = new Directory('個人筆記');
const todo = new TextFile('待辦清單.txt', 1024, 'UTF-8');
const archive = new Directory('2025備份');
const meeting = new WordFile('會議記錄.docx', 200 * 1024, 5);
archive.add(meeting);
personalNotes.add(todo);
personalNotes.add(archive);

const readme = new TextFile('README.txt', 500, 'ASCII');

root.add(projectDocs);
root.add(personalNotes);
root.add(readme);

spec.addTag('Urgent');
apiDoc.addTag('Work');
todo.addTag('Work');
meeting.addTag('Personal');

/* ---------- 全域狀態 ---------- */
const history = new HistoryManager();
let selectedNode = null;
let clipboard = null;
let matchedIds = new Set();
let activeSortField = null;
let activeSortOrder = 'asc';
let isScanning = false;

/* ---------- Console / Observer 輔助 ---------- */
const consoleLogEl = document.getElementById('consoleLog');
function log(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  consoleLogEl.appendChild(div);
  consoleLogEl.scrollTop = consoleLogEl.scrollHeight;
}
function setObserver(nodeName, current, total) {
  document.getElementById('obsNode').textContent = nodeName;
  const pct = total ? Math.round((current / total) * 100) : 0;
  document.getElementById('obsPct').textContent = pct + '%';
  document.getElementById('obsFill').style.width = pct + '%';
  document.getElementById('obsCount').textContent = `${current} / ${total} Nodes`;
}
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* ---------- 走訪動畫（Observer 即時監控）：計算大小 / 搜尋 共用 ---------- */
async function runTraversal({ mode, ext }) {
  if (isScanning) return;
  isScanning = true;
  document.getElementById('resultBox').style.display = 'none';
  matchedIds = new Set();
  const flat = flattenTree(root);
  const total = flat.length;
  let matchCount = 0;

  for (let i = 0; i < flat.length; i++) {
    const path = flat[i];
    const node = path[path.length - 1];
    const pathStr = path.map((n) => n.name).join(' -> ');
    setObserver(node.name, i + 1, total);

    if (mode === 'size') {
      log(`Visiting: ${pathStr}`);
    } else {
      log(`Visiting: ${pathStr}`);
      const normalizedExt = ext.replace(/^\./, '').toLowerCase();
      if (!(node instanceof Directory) && node.getExtension().toLowerCase() === normalizedExt) {
        matchCount++;
        matchedIds.add(node.id);
        log(`[符合] ${node.name}`, 'match');
        render();
      }
    }
    await sleep(60);
  }

  isScanning = false;
  if (mode === 'size') {
    const total_ = root.getSize();
    log(`總容量: ${formatBytes(total_)}`, 'result');
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.textContent = `總容量：${formatBytes(total_)}`;
  } else {
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.textContent = `找到 ${matchCount} 項`;
    log(`找到 ${matchCount} 項`, 'result');
  }
  render();
}

/* ---------- 渲染 ---------- */
function countTag(node, tag) {
  let c = node.tags.includes(tag) ? 1 : 0;
  if (node instanceof Directory) node.children.forEach((ch) => (c += countTag(ch, tag)));
  return c;
}
function updateTagChipCounts() {
  ['Urgent', 'Work', 'Personal'].forEach((tag) => {
    const n = countTag(root, tag);
    const el = document.getElementById('count' + tag);
    el.style.display = n > 0 ? 'flex' : 'none';
    el.textContent = n;
  });
}

function renderNode(node, depth) {
  const row = document.createElement('div');
  row.className = 'node-row' + (selectedNode === node ? ' selected' : '') + (matchedIds.has(node.id) ? ' matched' : '');
  row.dataset.id = node.id;

  row.innerHTML = `
    ${node.getIcon()}
    <span class="node-name">${node.name}</span>
    <span class="node-detail">${node instanceof Directory ? '(' + formatBytes(node.getSize()) + ')' : '(' + node.getDetail() + ')'}</span>
    <span class="grow"></span>
    <span class="node-tags">${node.tags.map((t) => `<span class="tag-pill ${t}">${t.toUpperCase()}<span class="x" data-remove-tag="${t}">×</span></span>`).join('')}</span>
  `;

  row.addEventListener('click', (e) => {
    if (e.target.dataset.removeTag) {
      e.stopPropagation();
      history.execute(new ToggleTagCommand(node, e.target.dataset.removeTag));
      return;
    }
    selectedNode = node;
    render();
  });

  const wrap = document.createElement('div');
  wrap.appendChild(row);

  if (node instanceof Directory && node.children.length) {
    const childWrap = document.createElement('div');
    childWrap.className = 'children';
    node.children.forEach((c) => childWrap.appendChild(renderNode(c, depth + 1)));
    wrap.appendChild(childWrap);
  }
  return wrap;
}

function render() {
  const treeRoot = document.getElementById('treeRoot');
  treeRoot.innerHTML = '';
  treeRoot.appendChild(renderNode(root, 0));
  updateTagChipCounts();

  document.getElementById('btnUndo').disabled = history.undoStack.length === 0;
  document.getElementById('btnRedo').disabled = history.redoStack.length === 0;
  document.getElementById('btnCopy').disabled = !selectedNode;
  document.getElementById('btnDelete').disabled = !selectedNode || selectedNode === root;
  document.getElementById('btnPaste').disabled = !clipboard || !selectedNode || !(selectedNode instanceof Directory);

  ['Urgent', 'Work', 'Personal'].forEach((tag) => {
    document.getElementById('chip' + tag).classList.toggle('active', !!(selectedNode && selectedNode.tags.includes(tag)));
  });
  document.getElementById('sortName').classList.toggle('active', activeSortField === 'name');
  document.getElementById('sortSize').classList.toggle('active', activeSortField === 'size');
  document.getElementById('sortType').classList.toggle('active', activeSortField === 'type');
  document.getElementById('sortTag').classList.toggle('active', activeSortField === 'tag');
}

/* ---------- 事件綁定 ---------- */
document.getElementById('btnUndo').addEventListener('click', () => history.undo());
document.getElementById('btnRedo').addEventListener('click', () => history.redo());

document.getElementById('btnCopy').addEventListener('click', () => {
  if (!selectedNode) return;
  clipboard = selectedNode;
  log(`複製項目: ${selectedNode.name}`, 'cmd');
  render();
});
document.getElementById('btnPaste').addEventListener('click', () => {
  if (!clipboard || !selectedNode || !(selectedNode instanceof Directory)) return;
  history.execute(new PasteCommand(selectedNode, clipboard));
});
document.getElementById('btnDelete').addEventListener('click', () => {
  if (!selectedNode || selectedNode === root) return;
  const cmd = new RemoveCommand(selectedNode);
  selectedNode = null;
  history.execute(cmd);
});

function onSort(field) {
  activeSortField = field;
  activeSortOrder = activeSortOrder === 'asc' ? 'desc' : 'asc';
  history.execute(new SortCommand(root, field, activeSortOrder));
}
document.getElementById('sortName').addEventListener('click', () => onSort('name'));
document.getElementById('sortSize').addEventListener('click', () => onSort('size'));
document.getElementById('sortType').addEventListener('click', () => onSort('type'));
document.getElementById('sortTag').addEventListener('click', () => onSort('tag'));

['Urgent', 'Work', 'Personal'].forEach((tag) => {
  document.getElementById('chip' + tag).addEventListener('click', () => {
    if (!selectedNode) { log('請先選取一個項目再貼上標籤', 'undo'); return; }
    history.execute(new ToggleTagCommand(selectedNode, tag));
  });
});

document.getElementById('btnCalcSize').addEventListener('click', () => runTraversal({ mode: 'size' }));
document.getElementById('btnExportXml').addEventListener('click', () => {
  const xml = toXML(root);
  log('執行 XML 匯出', 'cmd');
  const blob = new Blob([xml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'file-structure.xml'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('btnSearch').addEventListener('click', () => {
  const ext = document.getElementById('searchInput').value.trim();
  if (!ext) return;
  runTraversal({ mode: 'search', ext });
});
document.getElementById('clearSearch').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  matchedIds = new Set();
  document.getElementById('resultBox').style.display = 'none';
  render();
});

/* ---------- 初始化 ---------- */
selectedNode = readme;
setObserver('README.txt', 10, 10);
log('掃描檔案: README.txt');
log('[符合] 會議記錄.docx', 'match');
log('掃描目錄: 2025備份');
log('掃描檔案: 待辦清單.txt');
log('掃描目錄: 個人筆記');
log('掃描檔案: 系統架構圖.png');
log('[符合] API介面定義.docx', 'match');
log('[符合] 需求規格書.docx', 'match');
log('掃描目錄: 專案文件');
log('掃描目錄: 我的根目錄');
render();
</script>
